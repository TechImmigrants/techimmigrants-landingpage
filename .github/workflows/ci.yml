name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: 🔍 Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔧 Setup project
        uses: ./.github/actions/setup

      - name: 🔍 Lint
        run: npm run lint

      - name: 🔧 Check types
        run: npx tsc -b

      - name: 🏗️ Build
        run: npm run build

      - name: 🧪 Test
        run: npm run test --if-present
